<script>
/* 主题：localStorage 优先，没存过就用浅色（本站默认皮肤 = 银白铝）。
   必须在首帧前执行，否则会闪一下深底（token 的键在 <html data-theme> 上）。 */
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t !== 'dark' && t !== 'light') t = 'light';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#12171b' : '#cfd6dd');
  } catch (e) {}
})();
</script>

  body {   color: var(--text); line-height: 1.9; min-height: 100vh; }

  .lang a:hover { background: var(--surface-2); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }
  .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius); padding: 30px 32px; box-shadow: var(--shadow); }

  .foot { max-width: 860px; margin: 24px auto 0; padding: 0 20px 40px; text-align: center; font-size: 12px; color: var(--text-dim); }

  @media (max-width: 640px){ .card{ padding: 22px 18px; } h1{ font-size: 20px; } pre.terms{ font-size: 13px; } }
</style>
