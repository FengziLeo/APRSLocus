<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>徽章 · APRSlocus</title>
<meta name="description" content="APRSlocus 荣誉称号徽章专属页">
<meta property="og:title" content="APRSlocus Badge">
<meta property="og:image" content="https://aprslocus.theez.top/assets/logo.png">
<link rel="icon" href="https://aprslocus.theez.top/assets/logo.png">
<link rel="stylesheet" href="css/theme.css?v=1">
<script>
/* 主题：localStorage 优先，没存过就用深色（本站默认皮肤 = 深空黑）。
   必须在首帧前执行，否则会闪一下亮底（token 的键在 <html data-theme> 上）。 */
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t !== 'dark' && t !== 'light') t = 'dark';
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#0a0e12' : '#f4f7fc');
  } catch (e) {}
})();
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;
    color:var(--text);display:flex;flex-direction:column;align-items:center;min-height:100vh;-webkit-font-smoothing:antialiased}
  .top{width:100%;display:flex;align-items:center;gap:10px;padding:16px 20px;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-weight:800}
  .brand img{width:28px;height:28px;border-radius:8px}
  .langs{display:flex;gap:4px}
  .langs button{font:inherit;font-size:12px;color:var(--text-dim);background:var(--surface-1);border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
  .langs button.on{color:var(--on-code);background:var(--code-bg);border-color:var(--line-strong);font-weight:700}
  .wrap{max-width:760px;width:100%;padding:20px 16px 40px;display:flex;flex-direction:column;align-items:center}
  /* 徽章主卡 */
  .card{background:var(--surface-1);border:1px solid var(--line);border-radius: var(--radius);width:100%;overflow:hidden;
    box-shadow:0 24px 60px -30px var(--shadow-color);text-align:center}
  .card .head{position:relative;padding:44px 24px 26px;color:#fff;overflow:hidden}
  .card .head::before{content:"";position:absolute;inset:0;background:
    radial-gradient(400px 220px at 70% -10%, rgba(255, 255, 255, .14), transparent 60%);}
  .badge-ic{width:110px;height:110px;border-radius: var(--radius);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
    background:rgba(255, 255, 255, .14);border:1px solid rgba(255, 255, 255, .18);box-shadow:0 18px 40px -14px var(--shadow-color);position:relative}
  .badge-ic svg{width:56px;height:56px;filter:drop-shadow(0 4px 10px var(--shadow-color))}
  .card h1{font-size:clamp(30px,8vw,48px);font-weight:900;letter-spacing:2px;text-shadow:0 3px 12px var(--shadow-color);position:relative}
  .card .who{font-size:15px;margin-top:10px;opacity:.95;position:relative}
  .card .desc{margin:0 auto;padding:22px 26px 10px;max-width:600px}
  .card .desc p{color:var(--text-dim);font-size:16px;line-height:2;position:relative}
  .card .desc p::before{content:"“";font-size:44px;color:var(--text-faint);display:block;height:.5;font-family:Georgia,serif;line-height:.4}
  /* 获得条件：做成淡底卡片行，与上面的诗意描述视觉区分 */
  .card .criteria{display:flex;justify-content:center;padding:2px 26px 24px}
  .card .criteria .inner{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
    background:var(--surface-1);border:1px solid var(--line);border-radius: var(--radius);padding:10px 18px;max-width:520px}
  .card .criteria .cl{font-size:11px;letter-spacing:1.5px;font-weight:800;color:var(--text-dim);white-space:nowrap}
  .card .criteria .cv{font-size:14px;font-weight:700;color:var(--cyan-deep)}
  /* 持有者 */
  .holders{margin-top:20px;width:100%}
  .holders h2{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:var(--text-dim);font-weight:700;margin-bottom:14px}
  .holders h2::after{content:"";flex:1;height:1px;background:var(--halo-cool)}
  .hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .hcard{background:var(--surface-1);border:1px solid var(--line);border-radius: var(--radius);padding:16px 14px;text-align:center;cursor:pointer;transition:.2s;text-decoration:none;color:inherit}
  .hcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px var(--shadow-color);border-color:var(--line)}
  .hcard .ha{width:46px;height:46px;border-radius: var(--radius);color:#fff;font:800 17px Consolas,monospace;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
  .hcard .hc{font-weight:800;font-family: var(--font-mono);font-size:15px}
  .hcard .hw{color:var(--text-dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--text-dim);text-align:center;padding:20px}
  .back{margin-top:26px;display:inline-flex;align-items:center;gap:6px;color:var(--cyan-deep);font-size:14px;text-decoration:none;padding:10px 18px;background:var(--surface-1);border-radius: var(--radius);border:1px solid var(--line)}
  .back:hover{color:var(--text)}
  .foot{margin:28px 0 10px;color:var(--text-dim);font-size:12px}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="member-card.html"><img src="https://aprslocus.theez.top/assets/logo.png" alt=""><span>APRSlocus</span></a>
  <div class="langs">
    <button data-lang="zh" onclick="setLang('zh')">简</button>
    <button data-lang="zh-TW" onclick="setLang('zh-TW')">繁</button>
    <button data-lang="en" onclick="setLang('en')">EN</button>
    <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="切换深色模式" title="切换深色模式" data-label-dark="切换浅色模式" data-label-light="切换深色模式"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="tic-sun" d="M12 6.6a5.4 5.4 0 1 0 0 10.8 5.4 5.4 0 0 0 0-10.8zM12 1.6v2.4M12 20v2.4M4.6 12H2.2M21.8 12h-2.4M6.75 6.75 5.05 5.05M18.95 18.95l-1.7-1.7M17.25 6.75l1.7-1.7M5.05 18.95l1.7-1.7"/><path class="tic-moon" d="M20.2 14.6A8.6 8.6 0 0 1 9.4 3.8a8.6 8.6 0 1 0 10.8 10.8z"/></svg></button>
  </div>
</div>

<div class="wrap">
  <div class="card" id="card"></div>
  <div class="holders">
    <h2 id="holdersTitle">拥有此徽章的成员</h2>
    <div class="hgrid" id="holders"></div>
  </div>
  <a class="back" href="member-card.html" id="back">← 返回成员墙</a>
</div>
<div class="foot" id="foot">APRSlocus · 荣誉徽章</div>

<script>
const TX={
 "zh":{holders:"拥有此徽章的成员",back:"← 返回成员墙",locked:"暂无",criteria:"获得条件"},
 "zh-TW":{holders:"擁有此徽章的成員",back:"← 返回成員牆",locked:"暫無",criteria:"獲得條件"},
 "en":{holders:"Members holding this badge",back:"← Back to members",locked:"None yet",criteria:"How to earn"}
};
const ICONS={
 kaishan:'<path d="M3 20h18M5 20c0-6 3-11 7-13 0 0 4-2 6 1 1-2 3-2 4 0 0 2-1 4-4 5-2 1-4 1-6 3-2 1-4 4-7 4z"/>',
 developer:'<path d="M8 6l-5 6 5 6M16 6l5 6-5 6M14 4l-4 16"/>',
 earlyMember:'<path d="M12 2l8 3v6c0 5-3.2 8.6-8 10-4.8-1.4-8-5-8-10V5l8-3zm0 6a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/>',
 mostBrain:'<path d="M9 3h6a4 4 0 014 4c0 1.5-.8 2.8-2 3.5V16H7v-5.5A4 4 0 015 7a4 4 0 014-4zm-2 15h10v2H7v-2zm1 3h8v1H8v-1z"/>',
 sower:'<path d="M12 20v-9M12 11c0-3.8 2.8-6.8 6.5-7.6-.4 4.1-2.8 6.9-6.5 7.6zm0 0c0-3.2-2.3-5.7-5.4-6.4.4 3.4 2.3 5.7 5.4 6.4zM5 20h14"/>',
 iSelfReliant:'<path d="M4.5 5h15v14h-15zM8 9.5l3 3-3 3M13.5 15.5h3"/>'
};
let lang="zh";
function detect(){const q=new URLSearchParams(location.search);if(q.get("lang"))return q.get("lang");
 const n=(navigator.language||"zh-CN").toLowerCase();return n.startsWith("zh-tw")||n.startsWith("zh-hk")?"zh-TW":n.startsWith("en")?"en":"zh";}
function setLang(l){lang=l;const u=new URL(location);if(l!=="zh")u.searchParams.set("lang",l);else u.searchParams.delete("lang");history.replaceState(null,"",u);render();}
function T(o){return o?o[lang]||o.zh||"":"";}
function render(){
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
 const h=document.getElementById("holdersTitle");h.textContent=TX[lang].holders;
 const b=document.getElementById("back");b.innerHTML="← "+TX[lang].back;
 const key=new URLSearchParams(location.search).get("honor")||"earlyMember";
 if(!window.__members){return;}
 const m=window.__members;
 const def=m.honors[key];
 if(!def){document.getElementById("card").innerHTML="<p style='padding:40px'>Not found</p>";return;}
 const holders=[...m.developers,...m.earlyMembers].filter(x=>{
   const hs=typeof x.honors==="string"?[x.honors]:(x.honors||[]);
   return hs.includes(key);
 });
 document.getElementById("card").innerHTML=`
   <div class="head" style="background:linear-gradient(150deg,${def.color},#0a0e12 90%)">
     <div class="badge-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]||ICONS.earlyMember}</svg></div>
     <h1>${T(def)}</h1>
   </div>
   <div class="desc"><p>${def.desc?T(def.desc):""}</p></div>
   ${def.criteria?`<div class="criteria"><div class="inner"><span class="cl">${TX[lang].criteria}</span><span class="cv">${T(def.criteria)}</span></div></div>`:""}`;
 const holderBox=document.getElementById("holders");
 holderBox.innerHTML=holders.length? holders.map(x=>`
   <a class="hcard" href="member-card.html?call=${x.call}">
     <div class="ha" style="background:linear-gradient(140deg,${def.color},${def.color})">${(x.call[0]||"A").toUpperCase()}</div>
     <div class="hc">${x.call}</div>
     <div class="hw">${x.who?T(x.who):x.call}</div>
   </a>`).join("") : `<div class="empty">${TX[lang].locked}</div>`;
 document.documentElement.lang=lang==="zh"?"zh-CN":lang==="zh-TW"?"zh-Hant":"en";
}
lang=detect();
fetch("members.json").then(r=>r.ok?r.json():null).then(d=>{window.__members=d;render();}).catch(()=>{});
</script>
<script src="js/theme.js?v=1" defer></script>
</body>
</html>
